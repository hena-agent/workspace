name: _opencode

# Reusable workflow: run one opencode prompt or slash command against a pull
# request under a dedicated GitHub App identity. This file owns only the shared
# mechanics (token mint + checkout + run).
on:
  workflow_call:
    inputs:
      model:
        description: Provider/model id (e.g., openai/gpt-5.5, anthropic/claude-sonnet-5)
        required: true
        type: string
      variant:
        description: Model variant (e.g., xhigh, max)
        required: true
        type: string
      app-client-id:
        description: Client ID of the GitHub App whose identity posts the comment
        required: true
        type: string
      prompt:
        description: Full prompt passed to `opencode github run`, verbatim. Nothing is appended, so callers own every task-specific instruction including how findings should be posted.
        required: false
        default: ""
        type: string
      command:
        description: Repository-owned review command passed to `opencode run --command`
        required: false
        default: ""
        type: string
      command-arguments:
        description: Arguments passed to the slash command
        required: false
        default: ""
        type: string
      timeout-minutes:
        description: Hard cap for the job and basis for the OAuth lease check
        required: false
        default: 30
        type: number
      opencode-version:
        description: Optional exact OpenCode CLI version override; empty uses the action pin
        required: false
        default: ""
        type: string
    secrets:
      app-private-key:
        description: Private key of the GitHub App
        required: true
      opencode-auth-json:
        description: Single-provider CI OAuth credential derived from ~/.local/share/opencode/auth.json
        required: true
      codex-web-search-auth-json:
        description: OpenAI credential for the codex_web_search plugin tool, independent of the selected provider
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Keep a hard cap around both the GitHub agent and non-interactive command
    # paths. Observed runs finish in 4-10 minutes.
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Mint publishing app token
        id: publish-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Mint review app token
        id: review-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read

      - name: Checkout workflow workspace
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: ${{ inputs.command == '' }}
          # Prompt agents retain the App's installation permissions for any
          # commit/push behavior; command reviews only receive read access.
          token: ${{ inputs.command != '' && steps.review-token.outputs.token || steps.publish-token.outputs.token }}

      - name: Checkout pull request as review data
        if: inputs.command != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .opencode-review-target
          fetch-depth: 1
          persist-credentials: false
          token: ${{ steps.review-token.outputs.token }}

      - name: Sanitize pull request review data
        if: inputs.command != ''
        shell: bash
        run: bash .github/actions/run-opencode/sanitize-review-checkout.sh .opencode-review-target

      - name: Run ${{ inputs.model }} (${{ inputs.variant }})
        uses: ./.github/actions/run-opencode
        with:
          model: ${{ inputs.model }}
          variant: ${{ inputs.variant }}
          opencode-auth-json: ${{ secrets.opencode-auth-json }}
          codex-web-search-auth-json: ${{ secrets.codex-web-search-auth-json }}
          github-token: ${{ steps.publish-token.outputs.token }}
          review-token: ${{ steps.review-token.outputs.token }}
          prompt: ${{ inputs.prompt }}
          command: ${{ inputs.command }}
          command-arguments: ${{ inputs.command-arguments }}
          review-directory: ${{ inputs.command != '' && '.opencode-review-target' || '' }}
          timeout-minutes: ${{ inputs.timeout-minutes }}
          opencode-version: ${{ inputs.opencode-version }}
