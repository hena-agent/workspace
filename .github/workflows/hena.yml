name: hena

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  hena:
    if: |
      contains(github.event.comment.body, ' /hena') ||
      startsWith(github.event.comment.body, '/hena')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run Hena
        uses: hena-agent/hena/github@2c14fc5586fe0b88e5c04732d2e846769cc35671 # latest
        env:
          HENA_API_KEY: ${{ secrets.HENA_API_KEY }}
          HENA_PERMISSION: '{"bash": "deny"}'
        with:
          model: hena/claude-opus-4-5
