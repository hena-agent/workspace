name: test

on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on develop so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/develop', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    if: ${{ !contains(github.event.pull_request.title, '[skip ci]') }}
    name: unit (${{ matrix.settings.name }}, shard ${{ matrix.settings.shard }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
            shard: 1/2
            primary: true
          - name: linux
            host: ubuntu-latest
            shard: 2/2
            primary: false
          # Windows unit shards are temporarily disabled because they are the slowest
          # part of CI (~17-29m vs ~5m on Linux). Re-enable by restoring these entries.
          # - name: windows
          #   host: windows-latest
          #   shard: 1/3
          #   primary: true
          # - name: windows
          #   host: windows-latest
          #   shard: 2/3
          #   primary: false
          # - name: windows
          #   host: windows-latest
          #   shard: 3/3
          #   primary: false
    runs-on: ${{ matrix.settings.host }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@hena.dev"
          git config --global user.name "hena"

      - name: Cache Turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      - name: Run non-Hena unit tests
        if: matrix.settings.primary
        timeout-minutes: 45
        run: GITHUB_ACTIONS=false bun turbo test --filter='!hena'
        env:
          HENA_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}

      - name: Build Hena test dependencies
        run: bun turbo build --filter='hena^...'

      - name: Run Hena unit tests
        working-directory: packages/hena
        run: bun test --timeout 30000 --only-failures --shard=${{ matrix.settings.shard }}
        env:
          GITHUB_ACTIONS: false
          HENA_EXPERIMENTAL_DISABLE_FILEWATCHER: ${{ runner.os == 'Windows' && 'true' || 'false' }}
        timeout-minutes: 30

  gates:
    if: ${{ !contains(github.event.pull_request.title, '[skip ci]') }}
    name: generated and HttpApi gates
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build Hena test dependencies
        run: bun turbo build --filter='hena^...'

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        working-directory: packages/hena
        timeout-minutes: 10
        run: |
          bun run test:httpapi:coverage
          bun run test:httpapi:auth
          bun run test:httpapi:effect -- --progress --trace

  e2e:
    if: ${{ !contains(github.event.pull_request.title, '[skip ci]') }}
    name: e2e (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          # Windows e2e is temporarily disabled because it is the slowest part of CI.
          # Re-enable by restoring this entry.
          # - name: windows
          #   host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        if: runner.os == 'Linux'
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
        timeout-minutes: 45

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
