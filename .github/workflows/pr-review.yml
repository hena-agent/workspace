name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A called (reusable) workflow cannot exceed the caller's token scopes, and this
# repo's default workflow permission is read-only. The reusable workflow needs
# pull-requests/issues write, so grant those scopes explicitly at the caller.
permissions:
  contents: read
  pull-requests: write
  issues: write

# A new push to a PR supersedes the previous commit, so cancel the in-flight
# run for that PR. github.ref is refs/pull/<n>/merge here, so this is scoped
# per-PR and never cancels another PR.
concurrency:
  group: pr-review-${{ github.ref }}
  cancel-in-progress: true

# The resolver owns reviewer-global eligibility (off, fork, and [skip ci]) and
# maps REVIEWER_MODEL to the provider-specific auth and GitHub App identity.
jobs:
  resolve:
    uses: ./.github/workflows/_review-model.yml

  review:
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    name: review (${{ needs.resolve.outputs.label }})
    uses: ./.github/workflows/_opencode.yml
    with:
      model: ${{ needs.resolve.outputs.model }}
      variant: ${{ needs.resolve.outputs.variant }}
      app-client-id: ${{ vars[needs.resolve.outputs.client_id_var] }}
      opencode-version: ${{ needs.resolve.outputs.opencode_version }}
      command: review-pr
      command-arguments: ${{ github.event.pull_request.number }}
    secrets:
      app-private-key: ${{ secrets[needs.resolve.outputs.private_key_secret] }}
      opencode-auth-json: ${{ secrets[needs.resolve.outputs.auth_secret] }}
