name: _review-model

on:
  workflow_call:
    inputs:
      configuration:
        description: Configuration to resolve (review or brief)
        required: true
        type: string
    outputs:
      enabled:
        description: Whether the configured workflow should run
        value: ${{ jobs.resolve.outputs.enabled }}
      reason:
        description: Why the configured workflow is disabled, when applicable
        value: ${{ jobs.resolve.outputs.reason }}
      matrix:
        description: Resolved model matrix for parallel reviews
        value: ${{ jobs.resolve.outputs.matrix }}
      provider:
        description: Provider for the first resolved model
        value: ${{ jobs.resolve.outputs.provider }}
      model:
        description: First resolved provider/model id
        value: ${{ jobs.resolve.outputs.model }}
      variant:
        description: First resolved provider-specific model variant
        value: ${{ jobs.resolve.outputs.variant }}
      label:
        description: First resolved provider/model@variant label
        value: ${{ jobs.resolve.outputs.label }}
      auth_secret:
        description: Repository secret containing the first provider's auth.json entry
        value: ${{ jobs.resolve.outputs.auth_secret }}
      client_id_var:
        description: Repository variable containing the first provider's GitHub App client ID
        value: ${{ jobs.resolve.outputs.client_id_var }}
      private_key_secret:
        description: Repository secret containing the first provider's GitHub App private key
        value: ${{ jobs.resolve.outputs.private_key_secret }}
      opencode_version:
        description: Requested opencode CLI version override, or empty for the action pin
        value: ${{ jobs.resolve.outputs.opencode_version }}

# This workflow only resolves public configuration names. It does not need
# repository contents, pull request access, or secrets.
permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      reason: ${{ steps.resolve.outputs.reason }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      provider: ${{ steps.resolve.outputs.provider }}
      model: ${{ steps.resolve.outputs.model }}
      variant: ${{ steps.resolve.outputs.variant }}
      label: ${{ steps.resolve.outputs.label }}
      auth_secret: ${{ steps.resolve.outputs.auth_secret }}
      client_id_var: ${{ steps.resolve.outputs.client_id_var }}
      private_key_secret: ${{ steps.resolve.outputs.private_key_secret }}
      opencode_version: ${{ steps.resolve.outputs.opencode_version }}
    steps:
      - name: Resolve model configuration
        id: resolve
        shell: bash
        env:
          CONFIGURATION: ${{ inputs.configuration }}
          RAW_REVIEW_MODELS: ${{ vars.REVIEW_MODELS }}
          RAW_BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
          RAW_OPENCODE_VERSION: ${{ vars.REVIEWER_OPENCODE_VERSION }}
          VARS_JSON: ${{ toJSON(vars) }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          MODEL_CONFIG=$(jq -nc '
            {
              "anthropic": {
                "auth_secret": "OPENCODE_AUTH_JSON",
                "client_id_var": "HENA_REVIEWER_CLIENT_ID",
                "private_key_secret": "HENA_REVIEWER_PRIVATE_KEY"
              },
              "openai": {
                "auth_secret": "OPENAI_OPENCODE_AUTH_JSON",
                "client_id_var": "GPT_REVIEWER_CLIENT_ID",
                "private_key_secret": "GPT_REVIEWER_PRIVATE_KEY"
              },
              "opencode-go": {
                "auth_secret": "OPENCODE_GO_AUTH_JSON",
                "client_id_var": "HENA_REVIEWER_CLIENT_ID",
                "private_key_secret": "HENA_REVIEWER_PRIVATE_KEY"
              }
            }
          ')
          DEFAULT_REVIEW_MODELS="openai/gpt-5.6-sol@high,anthropic/claude-sonnet-5@max,opencode-go/ox-alpha-free@max"
          DEFAULT_BRIEF_MODEL="opencode-go/ox-alpha-free@max"

          case "$CONFIGURATION" in
            review)
              VARIABLE="REVIEW_MODELS"
              RAW_MODELS="$RAW_REVIEW_MODELS"
              DEFAULT_MODELS="$DEFAULT_REVIEW_MODELS"
              ;;
            brief)
              VARIABLE="BRIEF_MODEL"
              RAW_MODELS="$RAW_BRIEF_MODEL"
              DEFAULT_MODELS="$DEFAULT_BRIEF_MODEL"
              ;;
            *)
              echo "::error::configuration must be 'review' or 'brief', got '$CONFIGURATION'."
              exit 1
              ;;
          esac

          MODELS=$(jq -nr --arg value "$RAW_MODELS" '$value | gsub("^\\s+|\\s+$"; "")')
          OPENCODE_VERSION=$(jq -nr --arg value "$RAW_OPENCODE_VERSION" '$value | gsub("^\\s+|\\s+$"; "")')

          disable() {
            {
              echo "enabled=false"
              echo "reason=$1"
              echo 'matrix={"include":[]}'
              echo "label=disabled: $1"
              echo "opencode_version=$OPENCODE_VERSION"
            } >> "$GITHUB_OUTPUT"
            echo "$CONFIGURATION disabled: $1"
            {
              echo "### ${CONFIGURATION^} model configuration"
              echo "- Enabled: no"
              echo "- Reason: \`$1\`"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ "${MODELS,,}" = "off" ]; then
            disable "off"
            exit 0
          fi
          if [ -z "$HEAD_REPOSITORY" ] || [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            disable "fork"
            exit 0
          fi
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            disable "dependabot"
            exit 0
          fi

          SOURCE="$VARIABLE"
          if [ -z "$MODELS" ]; then
            MODELS="$DEFAULT_MODELS"
            SOURCE="workflow default"
          fi
          if [ -n "$OPENCODE_VERSION" ] && ! [[ "$OPENCODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::REVIEWER_OPENCODE_VERSION must be an exact semantic version such as '1.18.22', got '$OPENCODE_VERSION'."
            exit 1
          fi

          MODEL_LIST=$(jq -nc --arg value "$MODELS" '$value | split(",") | map(gsub("^\\s+|\\s+$"; ""))')
          if ! jq -e 'length > 0 and all(.[]; length > 0)' <<< "$MODEL_LIST" >/dev/null; then
            echo "::error::$VARIABLE contains an empty model entry. Use comma-separated provider/model@variant values."
            exit 1
          fi
          MODEL_COUNT=$(jq -r 'length' <<< "$MODEL_LIST")
          if [ "$CONFIGURATION" = "brief" ] && [ "$MODEL_COUNT" -ne 1 ]; then
            echo "::error::BRIEF_MODEL must contain exactly one provider/model@variant value or 'off'."
            exit 1
          fi
          if [ "$MODEL_COUNT" -gt 256 ]; then
            echo "::error::REVIEW_MODELS contains $MODEL_COUNT entries; GitHub Actions matrices support at most 256 jobs."
            exit 1
          fi
          if ! jq -e 'length == (unique | length)' <<< "$MODEL_LIST" >/dev/null; then
            echo "::error::$VARIABLE contains duplicate model entries."
            exit 1
          fi

          MATRIX='{"include":[]}'
          FIRST=true
          while IFS= read -r MODEL_REF; do
            if ! [[ "$MODEL_REF" =~ ^[a-z0-9][a-z0-9-]*/[A-Za-z0-9._:/-]+@[a-z0-9-]+$ ]]; then
              echo "::error::$VARIABLE entries must use provider/model@variant form, got '$MODEL_REF'."
              exit 1
            fi

            PROVIDER="${MODEL_REF%%/*}"
            MODEL_AND_VARIANT="${MODEL_REF#*/}"
            MODEL_ID="${MODEL_AND_VARIANT%@*}"
            VARIANT="${MODEL_AND_VARIANT##*@}"
            if ! jq -e --arg provider "$PROVIDER" 'has($provider)' <<< "$MODEL_CONFIG" >/dev/null; then
              REGISTERED=$(jq -r 'keys | join(", ")' <<< "$MODEL_CONFIG")
              echo "::error::$VARIABLE names unregistered provider '$PROVIDER' (registered: $REGISTERED). Add its auth_secret, client_id_var, and private_key_secret to .github/workflows/_review-model.yml."
              exit 1
            fi

            AUTH_SECRET=$(jq -r --arg provider "$PROVIDER" '.[$provider].auth_secret' <<< "$MODEL_CONFIG")
            CLIENT_ID_VAR=$(jq -r --arg provider "$PROVIDER" '.[$provider].client_id_var' <<< "$MODEL_CONFIG")
            PRIVATE_KEY_SECRET=$(jq -r --arg provider "$PROVIDER" '.[$provider].private_key_secret' <<< "$MODEL_CONFIG")
            if ! jq -e --arg name "$CLIENT_ID_VAR" '.[$name] | type == "string" and length > 0' <<< "$VARS_JSON" >/dev/null; then
              echo "::error::Repository variable $CLIENT_ID_VAR is empty. Register the GitHub App for provider '$PROVIDER' before selecting it."
              exit 1
            fi

            MODEL="$PROVIDER/$MODEL_ID"
            LABEL="$MODEL@$VARIANT"
            MATRIX=$(jq -c \
              --arg model "$MODEL" \
              --arg variant "$VARIANT" \
              --arg label "$LABEL" \
              --arg auth_secret "$AUTH_SECRET" \
              --arg client_id_var "$CLIENT_ID_VAR" \
              --arg private_key_secret "$PRIVATE_KEY_SECRET" \
              '.include += [{model: $model, variant: $variant, label: $label, auth_secret: $auth_secret, client_id_var: $client_id_var, private_key_secret: $private_key_secret}]' \
              <<< "$MATRIX")

            if [ "$FIRST" = true ]; then
              FIRST=false
              FIRST_PROVIDER="$PROVIDER"
              FIRST_MODEL="$MODEL"
              FIRST_VARIANT="$VARIANT"
              FIRST_LABEL="$LABEL"
              FIRST_AUTH_SECRET="$AUTH_SECRET"
              FIRST_CLIENT_ID_VAR="$CLIENT_ID_VAR"
              FIRST_PRIVATE_KEY_SECRET="$PRIVATE_KEY_SECRET"
            fi
          done < <(jq -r '.[]' <<< "$MODEL_LIST")

          {
            echo "enabled=true"
            echo "reason="
            echo "matrix=$MATRIX"
            echo "provider=$FIRST_PROVIDER"
            echo "model=$FIRST_MODEL"
            echo "variant=$FIRST_VARIANT"
            echo "label=$FIRST_LABEL"
            echo "auth_secret=$FIRST_AUTH_SECRET"
            echo "client_id_var=$FIRST_CLIENT_ID_VAR"
            echo "private_key_secret=$FIRST_PRIVATE_KEY_SECRET"
            echo "opencode_version=$OPENCODE_VERSION"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ${CONFIGURATION^} model configuration"
            echo "- Enabled: yes"
            jq -r '.include[].label | "- Model: `\(.)`"' <<< "$MATRIX"
            echo "- Source: \`$SOURCE\`"
            if [ -n "$OPENCODE_VERSION" ]; then
              echo "- OpenCode version override: \`$OPENCODE_VERSION\`"
            else
              echo "- OpenCode version override: none (use action pin)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
