name: _agent

on:
  workflow_call:
    inputs:
      command:
        description: Trusted maintenance command (agent-scan or agent-resolve)
        required: true
        type: string
      command-arguments:
        description: Arguments passed to the command
        required: false
        default: ""
        type: string
      model:
        description: Provider/model id
        required: true
        type: string
      variant:
        description: Model variant
        required: true
        type: string
      app-client-id:
        description: Hena Agent GitHub App client ID
        required: true
        type: string
      opencode-version:
        description: Optional exact OpenCode CLI version override
        required: false
        default: ""
        type: string
      timeout-minutes:
        description: Hard cap for the model job and OAuth lease check
        required: true
        type: number
    secrets:
      app-private-key:
        description: Hena Agent GitHub App private key
        required: true
      opencode-auth-json:
        description: Single-provider CI credential
        required: true
      codex-web-search-auth-json:
        description: OpenAI credential for codex_web_search
        required: false

# The model and publisher run on different runners. The model receives no App
# private key or write token; its artifact is untrusted input that the fresh
# publishing job validates before performing GitHub writes.
jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      app_slug: ${{ steps.app-token.outputs.app-slug }}
      branch: ${{ inputs.command == 'agent-resolve' && steps.guard.outputs.branch || '' }}
      enabled: ${{ inputs.command == 'agent-scan' && 'true' || steps.guard.outputs.enabled }}
      issue: ${{ steps.validate.outputs.issue }}
    steps:
      - name: Validate invocation
        id: validate
        shell: bash
        env:
          COMMAND: ${{ inputs.command }}
          COMMAND_ARGUMENTS: ${{ inputs.command-arguments }}
        run: |
          set -euo pipefail
          case "$COMMAND" in
            agent-scan)
              echo "issue=" >> "$GITHUB_OUTPUT"
              ;;
            agent-resolve)
              if ! [[ "$COMMAND_ARGUMENTS" =~ ^[1-9][0-9]*$ ]]; then
                echo "::error::agent-resolve requires one positive issue number, got '$COMMAND_ARGUMENTS'."
                exit 1
              fi
              echo "issue=$COMMAND_ARGUMENTS" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unsupported maintenance command '$COMMAND'."
              exit 1
              ;;
          esac

      - name: Mint preflight app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-issues: write
          permission-pull-requests: read

      - name: Guard resolver issue
        if: inputs.command == 'agent-resolve'
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE: ${{ steps.validate.outputs.issue }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          STATE=$(gh api "repos/$REPOSITORY/issues/$ISSUE" --jq '.state')
          if [ "$STATE" != "open" ]; then
            echo "::error::Issue #$ISSUE is not open."
            exit 1
          fi

          BRANCH="agent-issue-$ISSUE"
          OPEN_PR=$(gh pr list --repo "$REPOSITORY" --state open --head "$BRANCH" --limit 1 --json number,url)
          if [ "$(jq 'length' <<< "$OPEN_PR")" -gt 0 ]; then
            URL=$(jq -r '.[0].url' <<< "$OPEN_PR")
            gh issue comment "$ISSUE" --repo "$REPOSITORY" --body "An agent attempt is already open: $URL. Close it and re-add \`agent-resolve\` to retry."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Existing attempt: $URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  run:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}

      - name: Configure agent git identity
        shell: bash
        env:
          APP_SLUG: ${{ needs.preflight.outputs.app_slug }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BOT_ID=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq '.id')
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Prefetch scanner context
        if: inputs.command == 'agent-scan'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SCAN_SCOPE: ${{ inputs.command-arguments }}
        run: |
          set -euo pipefail
          CONTEXT="$RUNNER_TEMP/agent-scan-context.json"
          CUTOFF=$(date -u -d '90 days ago' +%Y-%m-%d)
          gh api --paginate "repos/$REPOSITORY/issues?state=open&labels=agent-task&per_page=100" \
            --jq '[.[] | select(.pull_request | not) | {number, title, body, html_url}]' \
            > "$RUNNER_TEMP/open-agent-issues-pages.ndjson"
          jq -s 'add' "$RUNNER_TEMP/open-agent-issues-pages.ndjson" > "$RUNNER_TEMP/open-agent-issues.json"
          gh api --paginate "repos/$REPOSITORY/issues?state=closed&labels=agent-task&since=${CUTOFF}T00:00:00Z&per_page=100" \
            --jq '[.[] | select(.pull_request | not) | {number, title, body, state_reason, closed_at, html_url}]' \
            > "$RUNNER_TEMP/closed-agent-issues-pages.ndjson"
          jq -s --arg cutoff "$CUTOFF" 'add | map(select(.closed_at >= $cutoff))' \
            "$RUNNER_TEMP/closed-agent-issues-pages.ndjson" > "$RUNNER_TEMP/closed-agent-issues.json"
          gh pr list --repo "$REPOSITORY" --state open --search 'author:app/dependabot' --limit 100 \
            --json number,title,url > "$RUNNER_TEMP/open-dependabot-prs.json"
          jq -n \
            --arg scope "$SCAN_SCOPE" \
            --slurpfile open "$RUNNER_TEMP/open-agent-issues.json" \
            --slurpfile closed "$RUNNER_TEMP/closed-agent-issues.json" \
            --slurpfile dependabot "$RUNNER_TEMP/open-dependabot-prs.json" \
            '{scope: $scope, open_agent_issues: $open[0], recently_closed_agent_issues: $closed[0], open_dependabot_prs: $dependabot[0]}' \
            > "$CONTEXT"
          echo "AGENT_SCAN_CONTEXT=$CONTEXT" >> "$GITHUB_ENV"

      - name: Prefetch resolver context
        if: inputs.command == 'agent-resolve'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          BRANCH: ${{ needs.preflight.outputs.branch }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CONTEXT="$RUNNER_TEMP/agent-resolve-context.json"
          OWNER=${REPOSITORY%%/*}
          NAME=${REPOSITORY#*/}
          gh issue view "$ISSUE" --repo "$REPOSITORY" --json number,title,body,state,url \
            > "$RUNNER_TEMP/resolve-issue.json"
          gh api --paginate "repos/$REPOSITORY/issues/$ISSUE/comments?per_page=100" \
            | jq -sc 'add' > "$RUNNER_TEMP/resolve-issue-comments.json"
          gh pr list --repo "$REPOSITORY" --state closed --head "$BRANCH" --limit 100 \
            --json number,title,body,url,state,closedAt,mergedAt \
            > "$RUNNER_TEMP/prior-prs.json"
          : > "$RUNNER_TEMP/prior-comments.ndjson"
          : > "$RUNNER_TEMP/prior-reviews.ndjson"
          : > "$RUNNER_TEMP/prior-inline-comments.ndjson"
          : > "$RUNNER_TEMP/prior-review-threads.ndjson"
          while IFS= read -r PR; do
            gh api --paginate "repos/$REPOSITORY/issues/$PR/comments?per_page=100" \
              | jq -sc --argjson pr "$PR" '{pull_request: $pr, comments: add}' \
              >> "$RUNNER_TEMP/prior-comments.ndjson"
            gh api --paginate "repos/$REPOSITORY/pulls/$PR/reviews?per_page=100" \
              | jq -sc --argjson pr "$PR" '{pull_request: $pr, reviews: add}' \
              >> "$RUNNER_TEMP/prior-reviews.ndjson"
            gh api --paginate "repos/$REPOSITORY/pulls/$PR/comments?per_page=100" \
              | jq -sc --argjson pr "$PR" '{pull_request: $pr, comments: add}' \
              >> "$RUNNER_TEMP/prior-inline-comments.ndjson"
            # shellcheck disable=SC2016
            gh api graphql --paginate \
              -f query='query($owner: String!, $name: String!, $pr: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100, after: $endCursor) {
                      nodes { isResolved isOutdated path line comments(first: 100) { nodes { author { login } body url createdAt } } }
                      pageInfo { hasNextPage endCursor }
                    }
                  }
                }
              }' \
              -f owner="$OWNER" -f name="$NAME" -F pr="$PR" \
              | jq -c --argjson pr "$PR" '{pull_request: $pr, threads: .data.repository.pullRequest.reviewThreads.nodes}' \
              >> "$RUNNER_TEMP/prior-review-threads.ndjson"
          done < <(jq -r '.[].number' "$RUNNER_TEMP/prior-prs.json")
          jq -n \
            --slurpfile issue "$RUNNER_TEMP/resolve-issue.json" \
            --slurpfile issue_comments "$RUNNER_TEMP/resolve-issue-comments.json" \
            --slurpfile attempts "$RUNNER_TEMP/prior-prs.json" \
            --slurpfile comments "$RUNNER_TEMP/prior-comments.ndjson" \
            --slurpfile reviews "$RUNNER_TEMP/prior-reviews.ndjson" \
            --slurpfile inline "$RUNNER_TEMP/prior-inline-comments.ndjson" \
            --slurpfile threads "$RUNNER_TEMP/prior-review-threads.ndjson" \
            '{
              issue: ($issue[0] + {comments: $issue_comments[0]}),
              prior_attempts: $attempts[0],
              prior_comments: $comments,
              prior_reviews: $reviews,
              prior_inline_comments: $inline,
              prior_review_threads: $threads
            }' \
            > "$CONTEXT"
          echo "AGENT_RESOLVE_CONTEXT=$CONTEXT" >> "$GITHUB_ENV"
          echo "AGENT_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git switch -c "$BRANCH"

      - name: Set up OpenCode
        uses: ./.github/actions/setup-opencode
        with:
          model: ${{ inputs.model }}
          variant: ${{ inputs.variant }}
          opencode-auth-json: ${{ secrets.opencode-auth-json }}
          codex-web-search-auth-json: ${{ secrets.codex-web-search-auth-json }}
          timeout-minutes: ${{ inputs.timeout-minutes }}
          opencode-version: ${{ inputs.opencode-version }}

      - name: Run maintenance command
        shell: bash
        env:
          MODEL: ${{ inputs.model }}
          VARIANT: ${{ inputs.variant }}
          COMMAND: ${{ inputs.command }}
          COMMAND_ARGUMENTS: ${{ inputs.command-arguments }}
          JOB_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
          BRANCH: ${{ needs.preflight.outputs.branch }}
          OPENCODE_DISABLE_CLAUDE_CODE: "1"
          OPENCODE_DISABLE_EXTERNAL_SKILLS: "1"
          OPENCODE_DISABLE_PROJECT_CONFIG: "1"
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.config/opencode/command"
          install -m 600 ".opencode/command/$COMMAND.md" "$HOME/.config/opencode/command/$COMMAND.md"

          PERMISSION_EDIT="deny"
          if [ "$COMMAND" = "agent-resolve" ]; then
            PERMISSION_EDIT="allow"
          fi
          OPENCODE_PERMISSION=$(jq -cn --arg edit "$PERMISSION_EDIT" '
            {
              edit: $edit,
              external_directory: "deny",
              bash: {"*": "allow"},
              question: "deny",
              todowrite: "deny"
            }
          ')
          export OPENCODE_PERMISSION

          PLUGINS='[]'
          if [ "${MODEL%%/*}" = "anthropic" ]; then
            PLUGINS=$(jq -c '. + ["@ex-machina/opencode-anthropic-auth@1.8.1"]' <<< "$PLUGINS")
          fi
          if [ -f ".opencode/plugin/codex-web-search.ts" ]; then
            PLUGINS=$(jq -c --arg path "file://$(pwd)/.opencode/plugin/codex-web-search.ts" '. + [$path]' <<< "$PLUGINS")
          fi
          INSTRUCTIONS=$(git ls-files -z -- \
            ':(glob)**/AGENTS.md' \
            ':(glob)**/CLAUDE.md' \
            ':(glob)**/CONTEXT.md' \
            | jq -Rsc --arg root "$PWD" 'split("\u0000") | map(select(length > 0) | $root + "/" + .)')
          OPENCODE_CONFIG_CONTENT=$(jq -cn \
            --argjson plugins "$PLUGINS" \
            --argjson instructions "$INSTRUCTIONS" \
            '{plugin: $plugins, instructions: $instructions}')
          export OPENCODE_CONFIG_CONTENT

          COMMAND_MINUTES=$(( JOB_TIMEOUT_MINUTES - 5 ))
          if [ "$COMMAND" = "agent-resolve" ]; then
            COMMAND_MINUTES=$(( JOB_TIMEOUT_MINUTES - 10 ))
          fi
          COMMAND_STATUS=0
          timeout --signal=TERM "${COMMAND_MINUTES}m" opencode run \
            --command "$COMMAND" \
            --model "$MODEL" \
            --variant "$VARIANT" \
            --format json \
            "$COMMAND_ARGUMENTS" \
            | tee "$RUNNER_TEMP/opencode-command.ndjson" \
            || COMMAND_STATUS=$?

          if [ "$COMMAND_STATUS" -eq 0 ]; then
            jq -jrs --arg operation final-text --arg command "$COMMAND" \
              -f ".github/actions/run-opencode/extract-review.jq" \
              "$RUNNER_TEMP/opencode-command.ndjson" > "$RUNNER_TEMP/opencode-command-result.md"
          elif jq -jers --arg operation completed-review --arg command "$COMMAND" \
            -f ".github/actions/run-opencode/extract-review.jq" \
            "$RUNNER_TEMP/opencode-command.ndjson" > "$RUNNER_TEMP/opencode-command-result.md"; then
            echo "::notice::Using the completed maintenance task after a retryable final provider error."
          else
            exit "$COMMAND_STATUS"
          fi

          install -d -m 700 "$RUNNER_TEMP/agent-artifact"
          install -m 600 "$RUNNER_TEMP/opencode-command-result.md" "$RUNNER_TEMP/agent-artifact/result.md"
          if [ "$COMMAND" = "agent-resolve" ]; then
            git bundle create "$RUNNER_TEMP/agent-artifact/result.bundle" \
              "refs/heads/$BRANCH" "^$AGENT_BASE_SHA"
          fi

      - name: Upload untrusted agent result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-result-${{ github.run_id }}-${{ inputs.command }}
          if-no-files-found: error
          retention-days: 1
          path: ${{ runner.temp }}/agent-artifact

  publish:
    needs: [preflight, run]
    if: needs.preflight.outputs.enabled == 'true' && needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {}
    steps:
      - name: Mint scanner publishing token
        if: inputs.command == 'agent-scan'
        id: scan-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-issues: write

      - name: Mint resolver publishing token
        if: inputs.command == 'agent-resolve'
        id: resolve-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Checkout trusted default branch
        if: inputs.command == 'agent-resolve'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.resolve-token.outputs.token }}

      - name: Download untrusted agent result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agent-result-${{ github.run_id }}-${{ inputs.command }}
          path: ${{ runner.temp }}/agent-artifact

      - name: Publish scanner issue
        if: inputs.command == 'agent-scan'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.scan-token.outputs.token }}
          MODEL: ${{ inputs.model }}
          VARIANT: ${{ inputs.variant }}
          OPENCODE_VERSION: ${{ inputs.opencode-version || '1.18.22' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          RESULT="$RUNNER_TEMP/agent-artifact/result.md"
          TITLE=$(jq -Rrs 'split("\n")[0]' "$RESULT")
          BODY=$(jq -Rrs 'split("\n") | .[1:] | join("\n") | sub("^\\s+"; "")' "$RESULT")
          if [ -z "$TITLE" ] || [ -z "$BODY" ]; then
            echo "::error::agent-scan returned an empty issue title or body."
            exit 1
          fi

          DUPLICATES=$(gh api --paginate "repos/$REPOSITORY/issues?state=open&labels=agent-task&per_page=100" \
            | jq -r --arg title "$TITLE" '.[] | select((.pull_request | not) and .title == $title) | .html_url')
          if [ -n "$DUPLICATES" ]; then
            echo "::error::agent-scan duplicated an open issue: $DUPLICATES"
            exit 1
          fi
          COUNT=$(gh api "repos/$REPOSITORY/issues?state=open&labels=agent-task&per_page=100" \
            --jq '[.[] | select(.pull_request | not)] | length')
          if [ "$COUNT" -ge 10 ]; then
            echo "::error::agent-task queue reached $COUNT issues while the scanner was running."
            exit 1
          fi
          gh label create agent-task --repo "$REPOSITORY" --color 1D76DB \
            --description "Filed by the automated repository maintenance scanner" --force
          gh label create agent-resolve --repo "$REPOSITORY" --color 1D76DB \
            --description "Run the automated resolver for this issue" --force

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          METADATA=$(jq -cn --arg model "$MODEL" --arg variant "$VARIANT" \
            --arg opencode_version "$OPENCODE_VERSION" --arg run_url "$RUN_URL" \
            '{model: $model, variant: $variant, opencode_version: $opencode_version, run_url: $run_url}')
          {
            printf '<!-- agent-task %s -->\n' "$METADATA"
            # shellcheck disable=SC2016
            printf '_OpenCode `%s` | `%s` (`%s`) | [workflow run](%s)_\n\n' "$OPENCODE_VERSION" "$MODEL" "$VARIANT" "$RUN_URL"
            printf '%s\n' "$BODY"
          } > "$RUNNER_TEMP/agent-issue-body.md"
          URL=$(gh issue create --repo "$REPOSITORY" --title "$TITLE" \
            --body-file "$RUNNER_TEMP/agent-issue-body.md" --label agent-task)
          printf 'Created issue: %s\n' "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate resolver result
        if: inputs.command == 'agent-resolve'
        id: validation
        shell: bash
        env:
          BRANCH: ${{ needs.preflight.outputs.branch }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE_SHA=$(git rev-parse "$GITHUB_WORKFLOW_SHA")
          git fetch "$RUNNER_TEMP/agent-artifact/result.bundle" \
            "refs/heads/$BRANCH:refs/remotes/agent/result"
          git switch -C "$BRANCH" refs/remotes/agent/result
          if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "::error::agent result does not descend from the trusted base commit."
            exit 1
          fi
          if git diff --quiet "$BASE_SHA..HEAD"; then
            echo "::error::agent-resolve produced no code changes."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::restored agent result has a dirty worktree."
            exit 1
          fi
          if git log --format='%s%n%b' "$BASE_SHA..HEAD" | grep -Eiq '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]'; then
            echo "::error::agent commits may not contain CI-skip directives."
            exit 1
          fi

          mapfile -d '' CHANGED < <(git diff --no-renames --name-only -z "$BASE_SHA...HEAD")
          for FILE in "${CHANGED[@]}"; do
            case "$FILE" in
              .github/workflows/* | .github/actions/* | .opencode/* | opencode.json | opencode.jsonc | script/translate-app.ts | \
              AGENTS.md | */AGENTS.md | CLAUDE.md | */CLAUDE.md | CONTEXT.md | */CONTEXT.md)
                echo "::error::Autonomous resolver PRs may not modify trusted automation input '$FILE'."
                exit 1
                ;;
            esac
          done

          STATE=$(gh api "repos/$REPOSITORY/issues/$ISSUE" --jq '.state')
          if [ "$STATE" != "open" ]; then
            echo "::error::Issue #$ISSUE was closed while the resolver was running."
            exit 1
          fi
          OPEN_PR=$(gh pr list --repo "$REPOSITORY" --state open --head "$BRANCH" --limit 1 --json url)
          if [ "$(jq 'length' <<< "$OPEN_PR")" -gt 0 ]; then
            echo "::error::Another pull request claimed issue #$ISSUE while the resolver was running."
            exit 1
          fi

          TITLE=$(gh issue view "$ISSUE" --repo "$REPOSITORY" --json title --jq '.title')
          if grep -Eiq '\[(skip ci|ci skip|no ci|skip actions|actions skip)\]' <<< "$TITLE"; then
            echo "::error::Issue title contains a CI-skip directive and cannot become a PR title."
            exit 1
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "title<<AGENT_TITLE"
            echo "$TITLE"
            echo "AGENT_TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Push resolver branch and open draft
        if: inputs.command == 'agent-resolve'
        id: pull-request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          BRANCH: ${{ needs.preflight.outputs.branch }}
          TITLE: ${{ steps.validation.outputs.title }}
          MODEL: ${{ inputs.model }}
          VARIANT: ${{ inputs.variant }}
          OPENCODE_VERSION: ${{ inputs.opencode-version || '1.18.22' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          STATE=$(gh api "repos/$REPOSITORY/issues/$ISSUE" --jq '.state')
          if [ "$STATE" != "open" ]; then
            echo "::error::Issue #$ISSUE was closed before publication."
            exit 1
          fi
          OPEN_PR=$(gh pr list --repo "$REPOSITORY" --state open --head "$BRANCH" --limit 1 --json url)
          if [ "$(jq 'length' <<< "$OPEN_PR")" -gt 0 ]; then
            echo "::error::Another pull request claimed issue #$ISSUE before publication."
            exit 1
          fi
          BASE_BRANCH=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          REMOTE_SHA=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$AUTH_HEADER" \
            push "--force-with-lease=refs/heads/$BRANCH:$REMOTE_SHA" origin "HEAD:refs/heads/$BRANCH"
          unset AUTH_HEADER

          STATE=$(gh api "repos/$REPOSITORY/issues/$ISSUE" --jq '.state')
          OPEN_PR=$(gh pr list --repo "$REPOSITORY" --state open --head "$BRANCH" --limit 1 --json url)
          if [ "$STATE" != "open" ] || [ "$(jq 'length' <<< "$OPEN_PR")" -gt 0 ]; then
            echo "::error::Issue #$ISSUE became ineligible after its branch was pushed."
            exit 1
          fi

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          METADATA=$(jq -cn --argjson issue "$ISSUE" --arg model "$MODEL" --arg variant "$VARIANT" \
            --arg opencode_version "$OPENCODE_VERSION" --arg run_url "$RUN_URL" \
            '{issue: $issue, model: $model, variant: $variant, opencode_version: $opencode_version, run_url: $run_url}')
          {
            printf '<!-- agent-resolve %s -->\n' "$METADATA"
            printf '%s\n\n' "$(<"$RUNNER_TEMP/agent-artifact/result.md")"
            printf 'Closes #%s\n\n' "$ISSUE"
            # shellcheck disable=SC2016
            printf '_OpenCode `%s` | `%s` (`%s`) | [workflow run](%s)_\n' "$OPENCODE_VERSION" "$MODEL" "$VARIANT" "$RUN_URL"
          } > "$RUNNER_TEMP/agent-pr-body.md"
          URL=$(gh pr create --repo "$REPOSITORY" --draft --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "$TITLE" --body-file "$RUNNER_TEMP/agent-pr-body.md")
          echo "number=${URL##*/}" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Draft pull request: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Watch draft CI
        if: inputs.command == 'agent-resolve'
        id: checks
        shell: bash
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          PR: ${{ steps.pull-request.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA=$(gh pr view "$PR" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')
          DEADLINE=$(( $(date +%s) + 15 * 60 ))
          STABLE=0
          sleep 120

          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            ROLLUP=$(gh pr view "$PR" --repo "$REPOSITORY" --json headRefOid,statusCheckRollup)
            CURRENT_SHA=$(jq -r '.headRefOid' <<< "$ROLLUP")
            if [ "$CURRENT_SHA" != "$SHA" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              REASON=$(printf '%s' "Pull request head changed while CI was being validated." | base64 -w0)
              echo "reason_b64=$REASON" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            CHECKS=$(jq '.statusCheckRollup' <<< "$ROLLUP")
            if [ "$(jq 'length' <<< "$CHECKS")" -eq 0 ]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
              echo "No checks appeared during the grace period." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            FAILED=$(jq -r '[.[] | select(
              (.__typename == "CheckRun" and .status == "COMPLETED" and (.conclusion | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not)) or
              (.__typename == "StatusContext" and (.state | IN("FAILURE", "ERROR")))
            ) | (.name // .context)] | join(", ")' <<< "$CHECKS")
            if [ -n "$FAILED" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              REASON=$(printf '%s' "Failed checks: $FAILED" | base64 -w0)
              echo "reason_b64=$REASON" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PENDING=$(jq '[.[] | select(
              (.__typename == "CheckRun" and .status != "COMPLETED") or
              (.__typename == "StatusContext" and (.state | IN("PENDING", "EXPECTED")))
            )] | length' <<< "$CHECKS")
            if [ "$PENDING" -eq 0 ]; then
              if [ "$STABLE" -eq 1 ]; then
                echo "ready=true" >> "$GITHUB_OUTPUT"
                echo "head_sha=$SHA" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              STABLE=1
            else
              STABLE=0
            fi
            sleep 30
          done

          echo "ready=false" >> "$GITHUB_OUTPUT"
          REASON=$(printf '%s' "Timed out waiting for pull request checks." | base64 -w0)
          echo "reason_b64=$REASON" >> "$GITHUB_OUTPUT"

      - name: Mark pull request ready
        if: inputs.command == 'agent-resolve' && steps.checks.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          PR: ${{ steps.pull-request.outputs.number }}
          EXPECTED_SHA: ${{ steps.checks.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          CURRENT_SHA=$(gh pr view "$PR" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Pull request head changed after CI validation."
            exit 1
          fi
          gh pr ready "$PR" --repo "$REPOSITORY"
          CURRENT_SHA=$(gh pr view "$PR" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')
          if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
            gh pr ready "$PR" --repo "$REPOSITORY" --undo
            echo "::error::Pull request head changed during the ready transition; returned it to draft."
            exit 1
          fi
          echo "Ready pull request: ${{ steps.pull-request.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report failed resolver CI
        if: inputs.command == 'agent-resolve' && steps.checks.outputs.ready == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          REPOSITORY: ${{ github.repository }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
          REASON_B64: ${{ steps.checks.outputs.reason_b64 }}
        run: |
          REASON=$(base64 -d <<< "$REASON_B64")
          gh issue comment "$ISSUE" --repo "$REPOSITORY" \
            --body "The resolver left a draft pull request at $PR_URL because CI did not pass. $REASON"
          echo "::error::$REASON"
          exit 1

      - name: Report resolver publishing failure
        if: failure() && inputs.command == 'agent-resolve' && steps.checks.outputs.ready != 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.resolve-token.outputs.token }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          REPOSITORY: ${{ github.repository }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          DETAIL=""
          if [ -n "$PR_URL" ]; then
            DETAIL=" Draft: $PR_URL."
          fi
          gh issue comment "$ISSUE" --repo "$REPOSITORY" \
            --body "The resolver could not publish a ready pull request.$DETAIL See $RUN_URL."

  report-run-failure:
    needs: [preflight, run]
    if: always() && inputs.command == 'agent-resolve' && needs.preflight.outputs.enabled == 'true' && needs.run.result != 'success' && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Mint issue comment token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-issues: write

      - name: Report failed resolver run
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ needs.preflight.outputs.issue }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue comment "$ISSUE" --repo "$REPOSITORY" \
            --body "The resolver failed before it could open a pull request. See $RUN_URL."
