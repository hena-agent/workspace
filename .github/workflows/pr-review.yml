name: pr-review

# Runs once when a PR is opened; adding the `pr-review` label re-runs it on demand.
on:
  pull_request:
    types: [opened, labeled]

# A called (reusable) workflow cannot exceed the caller's token scopes, and this
# repo's default workflow permission is read-only. The reusable workflow needs
# pull-requests/issues write, so grant those scopes explicitly at the caller.
permissions:
  contents: read
  pull-requests: write
  issues: write

# A new review request supersedes an in-flight review for the same PR.
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The resolver owns reviewer-global eligibility (off, fork, and Dependabot) and
# maps REVIEWER_MODEL to the provider-specific auth and GitHub App identity.
jobs:
  resolve:
    uses: ./.github/workflows/_review-model.yml

  review:
    needs: resolve
    if: >-
      needs.resolve.outputs.enabled == 'true' &&
      (
        github.event.action == 'opened' ||
        (github.event.action == 'labeled' && github.event.label.name == 'pr-review')
      )
    name: review (${{ needs.resolve.outputs.label }})
    uses: ./.github/workflows/_opencode.yml
    with:
      model: ${{ needs.resolve.outputs.model }}
      variant: ${{ needs.resolve.outputs.variant }}
      app-client-id: ${{ vars[needs.resolve.outputs.client_id_var] }}
      opencode-version: ${{ needs.resolve.outputs.opencode_version }}
      timeout-minutes: 40
      command: review
      command-arguments: ${{ github.event.pull_request.number }}
    secrets:
      app-private-key: ${{ secrets[needs.resolve.outputs.private_key_secret] }}
      opencode-auth-json: ${{ secrets[needs.resolve.outputs.auth_secret] }}
      # codex_web_search (a review-command plugin tool) always needs OpenAI
      # credentials for its own ChatGPT-backed search, independent of which
      # provider REVIEWER_MODEL selects for the review itself.
      codex-web-search-auth-json: ${{ secrets.OPENAI_OPENCODE_AUTH_JSON }}
