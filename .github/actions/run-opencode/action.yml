name: Run OpenCode
description: Restore OpenCode auth.json from a secret, install a pinned OpenCode CLI, and run `opencode github run` with a specific model and variant.

inputs:
  model:
    description: Provider/model id (e.g., anthropic/claude-opus-5, openai/gpt-5.5)
    required: true
  variant:
    description: Model variant for reasoning effort / thinking budget (e.g., max, xhigh)
    required: true
  opencode-auth-json:
    description: Contents of ~/.local/share/opencode/auth.json (pass via secrets)
    required: true
  github-token:
    description: Token used by the OpenCode action to post comments and reach the GitHub API
    required: true
  prompt:
    description: Final prompt passed to opencode github run.
    required: true

runs:
  using: composite
  steps:
    - name: Restore OpenCode auth.json
      shell: bash
      env:
        OPENCODE_AUTH_JSON: ${{ inputs.opencode-auth-json }}
      run: |
        set -euo pipefail
        if [ -z "${OPENCODE_AUTH_JSON}" ]; then
          echo "::error::OPENCODE_AUTH_JSON is empty. This typically happens for PRs from forks, where repo secrets are not exposed."
          exit 1
        fi
        install -d -m 700 "$HOME/.local/share/opencode"
        printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
        chmod 600 "$HOME/.local/share/opencode/auth.json"

    # The Anthropic OAuth refresh token rotates on use: refreshing mints a new
    # one and kills the old, so whichever holder refreshes first wins and every
    # other holder is left with `invalid_grant`. A runner that refreshed would
    # rotate the chain, discard the new token when the job ended, and break the
    # developer's machine and every other repo sharing the credential. CI must
    # therefore never refresh. Two mechanisms enforce that:
    #
    #   1. the publisher (hena-sync-opencode-auth.sh) replaces the refresh token
    #      in this secret with an inert sentinel, so a runner cannot rotate the
    #      chain even if it tried - it can only fail its own job
    #   2. a local refresher (hena-opencode-token-refresh.sh) renews the token
    #      at 2h remaining, so the published copy always carries >= ~1h50m of
    #      life and a job capped at 30m can never reach expiry
    #
    # This step verifies both actually held. Without it a stale secret surfaces
    # as an opaque `Token refresh failed: 400` from inside the auth plugin, and
    # a missing refresh key surfaces as `Model not found` - neither of which
    # says anything about the real cause.
    - name: Verify credential freshness
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        AUTH="$HOME/.local/share/opencode/auth.json"

        # Comfortably above this job's timeout-minutes, so a job that starts
        # valid stays valid through its longest permitted run.
        MIN_REMAINING_SEC=2400

        # Must match REFRESH_SENTINEL in hena-sync-opencode-auth.sh.
        REFRESH_SENTINEL="ci-refresh-disabled"

        PROVIDER="${MODEL%%/*}"

        if ! jq -e --arg p "$PROVIDER" '.[$p].type == "oauth"' "$AUTH" >/dev/null 2>&1; then
          echo "$PROVIDER does not use OAuth in this credential; nothing to verify."
          exit 0
        fi

        EXPIRES_MS="$(jq -r --arg p "$PROVIDER" '.[$p].expires // 0' "$AUTH")"
        REMAINING=$(( EXPIRES_MS / 1000 - $(date +%s) ))

        # opencode's Oauth schema marks `refresh` required and Auth.all()
        # silently drops entries that fail to decode, so a missing key never
        # surfaces as an auth error: the provider simply never registers and the
        # run dies with `Model not found: <the model being requested>`. Catch it
        # here, where the message can name the actual problem.
        REFRESH="$(jq -r --arg p "$PROVIDER" '.[$p].refresh // empty' "$AUTH")"
        if [ -z "$REFRESH" ]; then
          echo "::error::OPENCODE_AUTH_JSON carries no $PROVIDER refresh key. opencode requires it and will silently discard the entire credential without it, so this run would fail with a misleading 'Model not found: $MODEL'. The publisher must write the '$REFRESH_SENTINEL' sentinel, not delete the field."
          exit 1
        fi
        if [ "$REFRESH" != "$REFRESH_SENTINEL" ]; then
          echo "::warning::OPENCODE_AUTH_JSON carries a real-looking $PROVIDER refresh token rather than the '$REFRESH_SENTINEL' sentinel. A runner that can refresh can rotate the shared credential chain and break every other holder - check NEUTER_REFRESH_PROVIDERS in hena-sync-opencode-auth.sh."
        fi

        if [ "$REMAINING" -lt "$MIN_REMAINING_SEC" ]; then
          echo "::error::$PROVIDER access token has only ${REMAINING}s left (need >= ${MIN_REMAINING_SEC}s). OPENCODE_AUTH_JSON is stale, so this job would try to refresh it and fail. The publishing Mac is probably asleep or its crnd/launchd jobs are not running; once it is back, hena-opencode-token-refresh.sh republishes automatically."
          exit 1
        fi

        echo "$PROVIDER access token OK: ${REMAINING}s remaining (>= ${MIN_REMAINING_SEC}s required)."

    # We inline the install + run steps that the anomalyco/opencode/github
    # wrapper action used to provide. That action derives its cache key from an
    # UNAUTHENTICATED `curl https://api.github.com/repos/anomalyco/opencode/releases/latest`
    # run under `set -e -o pipefail`; on shared-IP GitHub runners that request is
    # intermittently rate-limited (HTTP 403), which aborts the job before the
    # action's own `${VERSION:-latest}` fallback can run. Pinning the version here
    # and keying the cache off it removes that flaky network dependency.
    #
    # OPENCODE_VERSION is the single source of truth for the cache key and the
    # install below. Bump intentionally; do not float to latest.
    #
    # It is also the floor for which `model:` values in the calling workflows
    # (pr-review.yml, pr-brief.yml) work: the CLI embeds its models.dev snapshot
    # at build time, and this build's model-id parsing decides which reasoning
    # options a model gets. A model missing from the snapshot fails the job
    # outright; one whose id shape the build does not recognize silently loses
    # adaptive thinking instead. So changing `model:` there may require bumping
    # this pin, and nothing enforces that pairing.
    #
    # That is exactly how this pin fell behind: `model:` was moved to
    # anthropic/claude-opus-5 while the pin stayed at 1.18.5, whose snapshot
    # predates the model, so every run died with `Model not found:
    # anthropic/claude-opus-5`. 1.18.13 carries both models the callers ask for.
    - name: Pin opencode CLI version
      shell: bash
      run: echo "OPENCODE_VERSION=1.18.13" >> "$GITHUB_ENV"

    # The agent shells out to this repo's bun scripts (typecheck, test,
    # lint, etc.), but the ubuntu-latest runner has no bun preinstalled. Install
    # it here so bun is on PATH before the agent runs. bun-version-file reads the
    # `packageManager` field in package.json (bun@1.3.14) as the single source of
    # truth, keeping the runner in sync with the lockfile and avoiding drift.
    # Action pin: commit 0c5077e = v2.2.0. Bump intentionally; do not float to a tag.
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Cache opencode CLI
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.opencode/bin
        key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENCODE_VERSION }}

    # The opencode.ai install script honors the VERSION env var.
    - name: Install opencode CLI
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ env.OPENCODE_VERSION }}
      run: curl -fsSL https://opencode.ai/install | bash

    - name: Add opencode to PATH
      shell: bash
      run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

    # Mirrors the wrapper action's env-driven entrypoint. use_github_token=true
    # makes opencode skip OIDC and use GITHUB_TOKEN for the GitHub API; provider
    # (model) auth comes from the auth.json restored above.
    - name: Run opencode
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        VARIANT: ${{ inputs.variant }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: "true"
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: opencode github run
