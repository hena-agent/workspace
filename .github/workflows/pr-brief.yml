name: pr-brief

# Publishes a "review companion" page for large PRs so reviewers can understand
# the change without reading the diff. Runs automatically when a PR is opened or
# marked ready for review; adding the `pr-brief` label re-runs it on demand.
on:
  pull_request:
    types: [opened, ready_for_review, labeled]

# A called (reusable) workflow cannot exceed the caller's token scopes, and this
# repo's default workflow permission is read-only. The reusable workflow needs
# pull-requests/issues write, so grant those scopes explicitly at the caller.
permissions:
  contents: read
  pull-requests: write
  issues: write

# A new brief request supersedes an in-flight brief for the same PR. Give
# unrelated label events unique groups so they cannot cancel an active brief.
concurrency:
  group: pr-brief-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name != 'pr-brief' && github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  resolve:
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'pr-brief'
    uses: ./.github/workflows/_review-model.yml
    with:
      configuration: brief

  # Gates the (expensive) model run so it only fires for PRs big enough to be
  # worth summarizing. Reviewer-global eligibility is handled by the resolver.
  # An explicit `pr-brief` label is a deliberate human request, so it also works
  # on drafts; the automatic triggers do not. GitHub fires `labeled` once per
  # label, so re-running means removing the label and adding it again.
  gate:
    needs: resolve
    if: >-
      needs.resolve.outputs.enabled == 'true' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'pr-brief') ||
        (github.event.action != 'labeled' && github.event.pull_request.draft == false)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      large: ${{ steps.size.outputs.large }}
    steps:
      # The webhook payload also carries additions/deletions, but GitHub computes
      # the diff asynchronously and can deliver 0 for a freshly opened PR, so
      # read the counts back from the API instead.
      - name: Measure diff size
        id: size
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed=$(gh api "repos/$REPO/pulls/$PR" --jq '.additions + .deletions')
          echo "PR #$PR changes $changed lines (threshold 150)"
          # Written as if/else because `[ ... ] && x=true` aborts under `set -e`
          # when the test is false.
          if [ "$changed" -ge 150 ]; then
            echo "large=true" >> "$GITHUB_OUTPUT"
          else
            echo "large=false" >> "$GITHUB_OUTPUT"
          fi

  brief:
    needs: [resolve, gate]
    if: needs.resolve.outputs.enabled == 'true' && needs.gate.outputs.large == 'true'
    name: brief (${{ needs.resolve.outputs.label }})
    uses: ./.github/workflows/_opencode.yml
    with:
      model: ${{ needs.resolve.outputs.model }}
      variant: ${{ needs.resolve.outputs.variant }}
      app-client-id: ${{ vars[needs.resolve.outputs.client_id_var] }}
      opencode-version: ${{ needs.resolve.outputs.opencode_version }}
      # `tmp/` in step 2 is load-bearing: `opencode github run` commits and
      # pushes any dirty worktree onto the PR branch once the agent finishes, and
      # `tmp` is git-ignored (see .gitignore) so the page never lands in the PR.
      # Dropping that ignore rule would silently start committing HTML.
      prompt: |
        Produce a review companion page for this pull request so a reviewer can grasp the
        change without reading the diff themselves.

        1. Read the full diff first with `gh pr diff ${{ github.event.pull_request.number }}`,
           plus whatever surrounding source files you need to understand intent. If it is
           too large to read at once, walk it file by file. Never speculate about code you
           have not read.

        2. Write a self-contained `index.html` into `tmp/pr-brief/` relative to the repo
           root, inlining CSS and JS; if you must split them out, keep every file in that
           directory. Do NOT create or modify files anywhere else in the repository, and do
           not run installers, formatters, or code generators: any change to a tracked file
           is automatically committed and pushed to this PR branch after you finish. `tmp/`
           is git-ignored, which is the only reason it is safe to write there.

        3. Budget the whole page for a 2-3 minute read: 400 words of prose maximum, at
           most four sections, at most two diagrams. Treat that as a hard cap, not a
           target — anyone who wants full detail will read the diff instead, and a long
           page defeats the point. Open with a 2-3 line plain-language summary of what the
           PR does and why, then add only what genuinely speeds up review: a map of the
           changed files ranked by how much attention each needs, a before/after diagram of
           whatever structure changed, and call-outs for parts that are risky or easy to
           miss. Drop any of those that earns nothing on this particular PR rather than
           filling it in for completeness. Prefer one compact table or diagram over
           paragraphs, never make the same point twice in both prose and a diagram, and cut
           anything a reviewer could infer from the file names alone. Draw diagrams as
           inline SVG or with Mermaid from a CDN. Explain behaviour and intent, not
           line-by-line code.

        4. Publish with the BrewPage API documented at https://brewpage.app/llms.txt. Send
           a `User-Agent` header on every request. Always pass `ns=hena-pr-brief` and
           `ttl=30`: this repository is private, and omitting `ns` would publish the page
           to BrewPage's public gallery and sitemap. Use `POST /api/html` for a single
           file, or `POST /api/sites` if you split into several.

        5. Your final response is posted verbatim as a single top-level PR comment. Keep it
           to the BrewPage link plus the same 2-3 line summary. Do not paste the page
           contents, do not post the comment yourself, and do not add disclaimers.
    secrets:
      app-private-key: ${{ secrets[needs.resolve.outputs.private_key_secret] }}
      opencode-auth-json: ${{ secrets[needs.resolve.outputs.auth_secret] }}
