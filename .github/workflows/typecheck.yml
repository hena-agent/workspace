name: typecheck

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  typecheck:
    if: ${{ !contains(github.event.pull_request.title, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # ubuntu-latest gives 2 vCPU / 7 GB on this plan. Turbo's default
      # concurrency starts enough parallel tsc processes to exhaust that and
      # get the runner OOM-killed ("received a shutdown signal") partway
      # through @opencode-ai/ui, so cap it.
      - name: Run typecheck
        run: bun turbo typecheck --concurrency=1
