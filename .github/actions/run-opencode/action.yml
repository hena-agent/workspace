name: Run OpenCode
description: Restore OpenCode auth.json, install a pinned CLI, and run a GitHub agent or slash command.

inputs:
  model:
    description: Provider/model id (e.g., anthropic/claude-sonnet-5, openai/gpt-5.5)
    required: true
  variant:
    description: Model variant for reasoning effort / thinking budget (e.g., max, xhigh)
    required: true
  opencode-auth-json:
    description: Single-provider CI credential published from ~/.local/share/opencode/auth.json
    required: true
  opencode-version:
    description: Optional exact OpenCode CLI version override; empty uses the pinned default
    required: false
    default: ""
  timeout-minutes:
    description: Calling job timeout; the OAuth lease must outlive it by 10 minutes
    required: true
  github-token:
    description: Write-scoped token used to publish comments and reviews
    required: true
  review-token:
    description: Read-only token used to collect built-in review context
    required: true
  prompt:
    description: Final prompt passed to opencode github run.
    required: false
    default: ""
  command:
    description: Built-in slash command passed to opencode run --command; currently only review.
    required: false
    default: ""
  command-arguments:
    description: Arguments passed to the slash command.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate OpenCode invocation
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        COMMAND: ${{ inputs.command }}
      run: |
        if [ -n "$PROMPT" ] && [ -n "$COMMAND" ]; then
          echo "::error::prompt and command are mutually exclusive."
          exit 1
        fi
        if [ -z "$PROMPT" ] && [ -z "$COMMAND" ]; then
          echo "::error::either prompt or command is required."
          exit 1
        fi
        if [ -n "$COMMAND" ] && [ "$COMMAND" != "review" ]; then
          echo "::error::unsupported slash command '$COMMAND'."
          exit 1
        fi

    - name: Restore OpenCode auth.json
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        OPENCODE_AUTH_JSON: ${{ inputs.opencode-auth-json }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        set -euo pipefail
        if [ -z "${OPENCODE_AUTH_JSON}" ]; then
          echo "::error::OPENCODE_AUTH_JSON is empty. This typically happens for PRs from forks, where repo secrets are not exposed."
          exit 1
        fi
        if ! [[ "$TIMEOUT_MINUTES" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::timeout-minutes must be a positive whole number, got '$TIMEOUT_MINUTES'."
          exit 1
        fi
        PROVIDER="${MODEL%%/*}"
        if [ "$PROVIDER" = "$MODEL" ] || [ -z "$PROVIDER" ]; then
          echo "::error::model must use provider/model form, got '$MODEL'."
          exit 1
        fi
        HEADROOM_MINUTES=10
        MIN_EXPIRES_MS=$(( ($(date +%s) + (TIMEOUT_MINUTES + HEADROOM_MINUTES) * 60) * 1000 ))

        if ! printf '%s' "$OPENCODE_AUTH_JSON" | jq -e \
          --arg provider "$PROVIDER" --arg sentinel "ci-refresh-disabled" --argjson min "$MIN_EXPIRES_MS" '
          .[$provider] as $auth
          | keys == [$provider]
            and (
              if $auth.type == "oauth" then
                (($auth.access | type) == "string" and ($auth.access | test("\\S")))
                and $auth.refresh == $sentinel
                and (($auth.expires | type) == "number" and ($auth.expires | floor) == $auth.expires)
                and $auth.expires >= $min
              elif $auth.type == "api" then
                (($auth.key | type) == "string" and ($auth.key | test("\\S")))
              else
                false
              end
            )
        ' >/dev/null; then
          echo "::error::The OpenCode auth secret must contain exactly one '$PROVIDER' credential: either an API key, or OAuth with refresh='ci-refresh-disabled' and at least $((TIMEOUT_MINUTES + HEADROOM_MINUTES))m remaining. Ask the credential owner to republish it."
          exit 1
        fi

        install -d -m 700 "$HOME/.local/share/opencode"
        printf '%s' "$OPENCODE_AUTH_JSON" > "$HOME/.local/share/opencode/auth.json"
        chmod 600 "$HOME/.local/share/opencode/auth.json"

    # We inline the install + run steps that the anomalyco/opencode/github
    # wrapper action used to provide. That action derives its cache key from an
    # UNAUTHENTICATED `curl https://api.github.com/repos/anomalyco/opencode/releases/latest`
    # run under `set -e -o pipefail`; on shared-IP GitHub runners that request is
    # intermittently rate-limited (HTTP 403), which aborts the job before the
    # action's own `${VERSION:-latest}` fallback can run. Pinning the version here
    # and keying the cache off it removes that flaky network dependency.
    #
    # OPENCODE_VERSION is the single source of truth for the cache key and the
    # install below. Bump intentionally; do not float to latest.
    #
    # It is also the floor for which `model:` values in the calling workflows
    # (pr-review.yml, pr-brief.yml) work: the CLI embeds its models.dev snapshot
    # at build time, and this build's model-id parsing decides which reasoning
    # options a model gets. A model missing from the snapshot fails the job
    # outright; one whose id shape the build does not recognize silently loses
    # adaptive thinking instead. So changing `model:` there may require bumping
    # this pin, and nothing enforces that pairing.
    - name: Pin opencode CLI version
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.opencode-version }}
      run: |
        set -euo pipefail
        OPENCODE_VERSION="${REQUESTED_VERSION:-1.18.18}"
        if ! [[ "$OPENCODE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::opencode-version must be an exact semantic version, got '$OPENCODE_VERSION'."
          exit 1
        fi
        echo "OPENCODE_VERSION=$OPENCODE_VERSION" >> "$GITHUB_ENV"
        {
          echo "### OpenCode CLI"
          echo "- Version: \`$OPENCODE_VERSION\`"
          if [ -n "$REQUESTED_VERSION" ]; then
            echo "- Source: \`REVIEWER_OPENCODE_VERSION\`"
          else
            echo "- Source: action pin"
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    # The agent shells out to this repo's bun scripts (typecheck, test,
    # lint, etc.), but the ubuntu-latest runner has no bun preinstalled. Install
    # it here so bun is on PATH before the agent runs. bun-version-file reads the
    # `packageManager` field in package.json (bun@1.3.14) as the single source of
    # truth, keeping the runner in sync with the lockfile and avoiding drift.
    # Action pin: commit 0c5077e = v2.2.0. Bump intentionally; do not float to a tag.
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json

    - name: Cache opencode CLI
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.opencode/bin
        key: opencode-${{ runner.os }}-${{ runner.arch }}-${{ env.OPENCODE_VERSION }}

    # The opencode.ai install script honors the VERSION env var.
    - name: Install opencode CLI
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ env.OPENCODE_VERSION }}
      run: curl -fsSL https://opencode.ai/install | bash

    - name: Add opencode to PATH
      shell: bash
      run: echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

    - name: Verify model is available
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        VARIANT: ${{ inputs.variant }}
        OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
      run: |
        set -euo pipefail
        PROVIDER="${MODEL%%/*}"
        if ! MODELS=$(opencode models "$PROVIDER" --verbose 2>&1); then
          printf '%s\n' "$MODELS"
          echo "::error::OpenCode $OPENCODE_VERSION could not load provider '$PROVIDER'. Verify its single-provider auth secret."
          exit 1
        fi
        if ! VARIANTS=$(MODEL="$MODEL" bun -e '
          import { modelVariants } from "./script/translate-app.ts"
          try {
            process.stdout.write(JSON.stringify(Object.keys(modelVariants(await Bun.stdin.text(), process.env.MODEL!))))
          } catch (error) {
            process.stderr.write(error instanceof Error ? error.message : String(error))
            process.exit(1)
          }
        ' <<< "$MODELS" 2>&1); then
          echo "::error::OpenCode $OPENCODE_VERSION could not resolve '$MODEL': $VARIANTS. Correct REVIEWER_MODEL or set REVIEWER_OPENCODE_VERSION to a release whose catalog contains it."
          exit 1
        fi
        if ! jq -e --arg variant "$VARIANT" 'index($variant) != null' <<< "$VARIANTS" >/dev/null; then
          AVAILABLE=$(jq -r 'join(", ")' <<< "$VARIANTS")
          echo "::error::Variant '$VARIANT' is unavailable for '$MODEL' in OpenCode $OPENCODE_VERSION (available: $AVAILABLE). Correct REVIEWER_MODEL."
          exit 1
        fi

    - name: Run OpenCode command
      if: inputs.command != ''
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        VARIANT: ${{ inputs.variant }}
        COMMAND: ${{ inputs.command }}
        COMMAND_ARGUMENTS: ${{ inputs.command-arguments }}
        GH_TOKEN: ${{ inputs.review-token }}
        OPENCODE_DISABLE_PROJECT_CONFIG: "1"
      run: |
        set -euo pipefail
        if ! [[ "$COMMAND_ARGUMENTS" =~ ^[1-9][0-9]*$ ]]; then
          echo "::error::review requires one pull request number, got '$COMMAND_ARGUMENTS'."
          exit 1
        fi

        REVIEW_CONTEXT="$RUNNER_TEMP/opencode-review-context"
        install -d -m 700 "$REVIEW_CONTEXT/bin"
        gh pr view "$COMMAND_ARGUMENTS" > "$REVIEW_CONTEXT/view"
        if ! gh pr diff "$COMMAND_ARGUMENTS" > "$REVIEW_CONTEXT/diff" 2> "$REVIEW_CONTEXT/diff-error"; then
          DIFF_ERROR=$(<"$REVIEW_CONTEXT/diff-error")
          if [[ "$DIFF_ERROR" != *"HTTP 406"* ]]; then
            printf '%s\n' "$DIFF_ERROR" >&2
            exit 1
          fi

          echo "::notice::GitHub could not render this PR's diff; using the local merge-base diff."
          BASE_SHA=$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          HEAD_SHA=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          MERGE_BASE_SHA=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            --jq '.merge_base_commit.sha')
          git fetch --no-tags --depth=1 origin "$MERGE_BASE_SHA" "$HEAD_SHA"
          git diff --no-ext-diff --find-renames "$MERGE_BASE_SHA" "$HEAD_SHA" > "$REVIEW_CONTEXT/diff"
        fi

        # These variables expand when OpenCode invokes the generated wrapper.
        # shellcheck disable=SC2016
        printf '%s\n' \
          '#!/usr/bin/env bash' \
          'set -euo pipefail' \
          'if [ "$#" -ne 3 ] || [ "$1" != "pr" ] || [ "$3" != "$OPENCODE_REVIEW_PR" ]; then' \
          '  echo "Only the configured PR view and diff commands are available." >&2' \
          '  exit 1' \
          'fi' \
          'case "$2" in' \
          '  view) cat "$OPENCODE_REVIEW_VIEW" ;;' \
          '  diff) cat "$OPENCODE_REVIEW_DIFF" ;;' \
          '  *) echo "Only PR view and diff are available." >&2; exit 1 ;;' \
          'esac' \
          > "$REVIEW_CONTEXT/bin/gh"
        chmod 700 "$REVIEW_CONTEXT/bin/gh"

        OPENCODE_PERMISSION=$(jq -cn --arg pr "$COMMAND_ARGUMENTS" '
          {
            edit: "deny",
            external_directory: "deny",
            bash: {
              "*": "deny",
              ("gh pr view " + $pr): "allow",
              ("gh pr diff " + $pr): "allow"
            },
            question: "deny",
            todowrite: "deny"
          }
        ')
        export OPENCODE_PERMISSION
        export OPENCODE_REVIEW_PR="$COMMAND_ARGUMENTS"
        export OPENCODE_REVIEW_VIEW="$REVIEW_CONTEXT/view"
        export OPENCODE_REVIEW_DIFF="$REVIEW_CONTEXT/diff"
        export PATH="$REVIEW_CONTEXT/bin:$PATH"
        git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
        unset GH_TOKEN

        opencode run \
          --command "$COMMAND" \
          --model "$MODEL" \
          --variant "$VARIANT" \
          --format json \
          "$COMMAND_ARGUMENTS" \
          | tee "$RUNNER_TEMP/opencode-command.ndjson"

        jq -jrs '
          [.[] | select(.type == "text") | .part.text] | last
          | if type == "string" and test("\\S") then . else error("OpenCode command returned no final text") end
        ' "$RUNNER_TEMP/opencode-command.ndjson" > "$RUNNER_TEMP/opencode-command-result.md"

    - name: Publish OpenCode review
      if: inputs.command != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        PR_NUMBER=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
        HEAD_SHA=$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
        BASE_SHA=$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
        read -r CURRENT_HEAD CURRENT_BASE < <(
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[.head.sha, .base.sha] | @tsv'
        )
        if [ "$CURRENT_HEAD" != "$HEAD_SHA" ] || [ "$CURRENT_BASE" != "$BASE_SHA" ]; then
          echo "::notice::Skipping stale review for base/head $BASE_SHA/$HEAD_SHA; pull request now points to $CURRENT_BASE/$CURRENT_HEAD."
          exit 0
        fi

        jq -n --arg head "$HEAD_SHA" --rawfile body "$RUNNER_TEMP/opencode-command-result.md" '
          {
            event: "COMMENT",
            commit_id: $head,
            body: $body
          }
        ' > "$RUNNER_TEMP/github-review.json"

        gh api \
          --method POST \
          "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
          --input "$RUNNER_TEMP/github-review.json"

    # Mirrors the wrapper action's env-driven entrypoint. use_github_token=true
    # makes opencode skip OIDC and use GITHUB_TOKEN for the GitHub API; provider
    # (model) auth comes from the auth.json restored above.
    - name: Run OpenCode GitHub agent
      if: inputs.command == ''
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
        VARIANT: ${{ inputs.variant }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: "true"
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: opencode github run
