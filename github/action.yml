name: "Hena GitHub Action"
description: "Run Hena in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the Hena session"
    required: false
    default: "false"

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly. Set to false only with a custom GitHub App token exchange service."
    required: false
    default: "true"

  mentions:
    description: "Comma-separated trigger phrases. Defaults to '/hena'."
    required: false
    default: "/hena"

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for a custom GitHub App token exchange API. Required when use_github_token is false."
    required: false

runs:
  using: "composite"
  steps:
    - name: Get Hena version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/hena-agent/hena/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache Hena
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.hena/bin
        key: hena-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install Hena
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://hena.dev/install | bash

    - name: Add Hena to PATH
      shell: bash
      run: echo "$HOME/.hena/bin" >> $GITHUB_PATH

    - name: Run Hena
      shell: bash
      id: run_hena
      run: hena github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        GITHUB_TOKEN: ${{ github.token }}
