name: _opencode

# Reusable workflow: run one opencode invocation against a pull request under a
# dedicated GitHub App identity. Callers own the entire prompt; this file owns
# only the mechanics every invocation shares (token mint + checkout + run),
# which is what makes it worth ~25 lines of dedup per caller job.
on:
  workflow_call:
    inputs:
      model:
        description: Provider/model id (e.g., openai/gpt-5.5, anthropic/claude-opus-5)
        required: true
        type: string
      variant:
        description: Model variant (e.g., xhigh, max)
        required: true
        type: string
      app-client-id:
        description: Client ID of the GitHub App whose identity posts the comment
        required: true
        type: string
      prompt:
        description: Full prompt passed to `opencode github run`, verbatim. Nothing is appended, so callers own every task-specific instruction including how findings should be posted.
        required: true
        type: string
      timeout-minutes:
        description: Hard cap for the job and basis for the OAuth lease check
        required: false
        default: 30
        type: number
    secrets:
      app-private-key:
        description: Private key of the GitHub App
        required: true
      opencode-auth-json:
        description: Anthropic-only CI credential derived from ~/.local/share/opencode/auth.json
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    # An unanswered permission request inside `opencode github run` blocks
    # forever: Permission.ask awaits a Deferred with no timeout and the github
    # command never replies. Without a cap that hang would burn the 6-hour
    # default and hold the caller's concurrency group for all of it. Observed
    # runs finish in 4-10 minutes.
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Run ${{ inputs.model }} (${{ inputs.variant }})
        uses: ./.github/actions/run-opencode
        with:
          model: ${{ inputs.model }}
          variant: ${{ inputs.variant }}
          opencode-auth-json: ${{ secrets.opencode-auth-json }}
          github-token: ${{ steps.app-token.outputs.token }}
          prompt: ${{ inputs.prompt }}
          timeout-minutes: ${{ inputs.timeout-minutes }}
